name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Triage issue with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Repo: ${{ github.repository }}
            Issue: #${{ github.event.issue.number }}
            Evento: ${{ github.event.action }} (opened = nuevo; edited = se editó título/cuerpo)

            Eres el triager de un juego Tetris en JavaScript vanilla (index.html, style.css, game.js; ver CLAUDE.md).
            Analiza el issue y deja listo el diagnóstico para que luego se implemente la solución. NO modifiques código ni el cuerpo/título del issue.

            Pasos:
            1. Lee el issue con `gh issue view ${{ github.event.issue.number }}` y explora el código relevante (game.js, index.html, style.css).

            2. Labels (taxonomía fija):
               - Tipo (exactamente uno): bug, enhancement, question, documentation
               - Área (uno o más): gameplay, ui, controls, scoring, performance
               - needs-info: solo si falta información para diagnosticar
               Usa `gh label list` y crea con `gh label create` los que no existan.
               Aplica con `gh issue edit ${{ github.event.issue.number }} --add-label ...`.
               Si el evento es edited, quita con --remove-label los labels de esta taxonomía que ya no apliquen (no toques otros labels).

            3. Diagnóstico: comentario en español, que empiece con la línea `<!-- claude-triage -->`, con estas secciones:
               - Resumen
               - Tipo y severidad
               - Causa probable (con referencias `archivo:línea` y funciones como collide, tryRotate, clearLines, loop, etc.)
               - Archivos/funciones a modificar
               - Enfoque de solución sugerido
               - Casos borde y cómo verificar (no hay tests: pasos manuales en el navegador)
               - Preguntas abiertas (si las hay)
               Si es una feature o pregunta, adapta "Causa probable" a "Análisis".

            4. Idempotencia: busca con `gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments` un comentario que contenga `<!-- claude-triage -->`.
               Si existe, actualízalo con `gh api -X PATCH repos/${{ github.repository }}/issues/comments/<id> -f body=...`.
               Si no, créalo con `gh issue comment`. Nunca dupliques el comentario.
          claude_args: |
            --max-turns 10
            --allowed-tools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*),Bash(gh label create:*),Bash(gh api:*)"
